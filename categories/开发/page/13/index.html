<script>
  (function () {
    var input = document.querySelector('.page-jump-input');
    if (!input) return;
    var total = parseInt(input.max, 10) || 1;
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') input.blur();
    });
    input.addEventListener('change', function () {
      var n = parseInt(input.value, 10);
      if (isNaN(n)) { input.value = input.defaultValue; return; }
      n = Math.max(1, Math.min(total, n));
      input.value = n;
      var path = window.location.pathname.replace(/\/page\/\d+\/?$/, '/');
      if (path === '') path = '/';
      if (!/\/$/.test(path)) path += '/';
      var url = n <= 1 ? path : path + 'page/' + n + '/';
      window.location.href = url;
    });
  })();
</script>

    function hideLoader() {

    }
    if (document.readyState === 'complete') {
        setTimeout(hideLoader, 200);
    } else {
        window.addEventListener('load', function () { setTimeout(hideLoader, 200); });
    }
    
    setTimeout(hideLoader, 3000);

    
    function updateProgress() {
        var bar = document.getElementById('reading-progress');
        if (!bar) return;
        var doc = document.documentElement;
        var scrollTop = window.scrollY || doc.scrollTop || document.body.scrollTop || 0;
        var height = doc.scrollHeight - doc.clientHeight;
        var pct = height > 0 ? (scrollTop / height) * 100 : 0;
        bar.style.width = pct + '%';
    }
    window.addEventListener('scroll', updateProgress, { passive: true });
    window.addEventListener('resize', updateProgress);
    updateProgress();

    
    var headings = Array.prototype.slice.call(
        document.querySelectorAll('.post-content h2[id], .post-content h3[id]')
    );
    var tocLinks = Array.prototype.slice.call(
        document.querySelectorAll('.toc-sidebar #TableOfContents a')
    );
    if (headings.length && tocLinks.length) {
        function onScrollSpy() {
            var pos = window.scrollY + 80;
            var currentId = headings[0] ? headings[0].id : null;
            headings.forEach(function (h) {
                if (h.offsetTop <= pos) currentId = h.id;
            });
            tocLinks.forEach(function (a) {
                var id = (a.getAttribute('href') || '').replace('#', '');
                if (id === currentId) a.classList.add('active');
                else a.classList.remove('active');
            });
        }
        window.addEventListener('scroll', onScrollSpy, { passive: true });
        onScrollSpy();
    }
})();
</script>


<script>
    let menu = document.getElementById('menu');
    if (menu) {
        
        const scrollPosition = localStorage.getItem("menu-scroll-position");
        if (scrollPosition) {
            menu.scrollLeft = parseInt(scrollPosition, 10);
        }
        
        
        let menuScrollTimeout;
        menu.addEventListener("scroll", function () {
            clearTimeout(menuScrollTimeout);
            menuScrollTimeout = setTimeout(function () {
                localStorage.setItem("menu-scroll-position", menu.scrollLeft);
            }, 150);
        }, { passive: true });
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            const target = document.querySelector(`[id='${decodeURIComponent(id)}']`);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                target.scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                target.scrollIntoView();
            }
            
            
            if (target.tabIndex < 0 && !target.hasAttribute("tabindex")) {
                target.setAttribute("tabindex", "-1");
            }
            target.focus({ preventScroll: true });
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
<script>
    var toplink = document.getElementById("top-link");
    var scrollTicking = false;
    
    window.addEventListener("scroll", function () {
        if (scrollTicking) {
            return;
        }
        scrollTicking = true;
        requestAnimationFrame(function () {
            const scrollThreshold = window.innerHeight;
            const shown = document.body.scrollTop > scrollThreshold || document.documentElement.scrollTop > scrollThreshold;
            toplink.classList.toggle("hidden", !shown);
            scrollTicking = false;
        });
    }, { passive: true });

</script>
